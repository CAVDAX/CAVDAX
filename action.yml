name: 'CAVDAX Causal Invalidation Gate'
description: 'Blocks pull requests containing code grounded in stale or superseded architecture decisions.'
author: 'CAVDAX Team'

inputs:
  falkordb_host:
    description: 'FalkorDB host address'
    required: false
    default: 'localhost'
  falkordb_port:
    description: 'FalkorDB port'
    required: false
    default: '6379'
  github_token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install MCP Server Dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}/apps/mcp-server
        npm install --prefer-offline

    - name: Ingest ADRs & Validate Commits
      shell: bash
      run: |
        if [ -f "${{ github.action_path }}/core/graph/queries.js" ]; then
          echo "🌱 Seeding baseline demo decisions in FalkorDB..."
          node -e "
            import('${{ github.action_path }}/core/graph/queries.js').then(async m => {
              const { connectGraph, closeQuietly } = await import('${{ github.action_path }}/apps/mcp-server/src/runtime.js');
              try {
                const { client, graph } = await connectGraph();
                if (graph && m.seedDemoGraph) {
                  await m.seedDemoGraph(graph);
                  console.log('   Demo baseline decisions seeded.');
                }
                await closeQuietly(client);
              } catch (e) {
                console.log('   Seed notice:', e.message);
              }
            });
          " || true
        fi

        echo "🔍 Scanning repository ADRs..."
        node ${{ github.action_path }}/apps/mcp-server/bin/cavdax.js ingest --repo ${{ github.workspace }}

        echo "🛡️ Verifying commit causal provenance..."
        CHECK_EXIT=0
        if [ -n "${{ github.event.pull_request.number }}" ]; then
          node ${{ github.action_path }}/apps/mcp-server/bin/cavdax.js check --pr ${{ github.event.pull_request.number }} || CHECK_EXIT=$?
        else
          node ${{ github.action_path }}/apps/mcp-server/bin/cavdax.js check --staged || CHECK_EXIT=$?
        fi

        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          if [ $CHECK_EXIT -eq 0 ]; then
            echo "### 🛡️ CAVDAX Causal Execution Gate: PASS" >> $GITHUB_STEP_SUMMARY
            echo "All touched files were verified against active architecture decisions." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Gate Verdict | Verified Causal Provenance | PASS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⛔ CAVDAX Causal Execution Gate: BLOCKED" >> $GITHUB_STEP_SUMMARY
            echo "PR contains code grounded in stale or superseded architecture decisions." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Gate Verdict | Stale Architecture Detected | BLOCKED |" >> $GITHUB_STEP_SUMMARY
          fi
        fi

        if [ $CHECK_EXIT -ne 0 ]; then
          exit $CHECK_EXIT
        fi
      env:
        FALKORDB_HOST: ${{ inputs.falkordb_host }}
        FALKORDB_PORT: ${{ inputs.falkordb_port }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
