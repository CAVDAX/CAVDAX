name: Publish MCP Server to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Verify & Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm OIDC Trusted Publishing and Sigstore provenance
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install -g npm@latest
          cd apps/server && npm install
          cd ../mcp-server && npm install

      - name: Syntax-check MCP Server Sources
        run: |
          node --check apps/mcp-server/bin/cavdax.js
          node --check apps/mcp-server/src/stdioServer.js
          node --check apps/mcp-server/src/ingestCommand.js
          node --check apps/mcp-server/src/checkCommand.js
          node --check apps/mcp-server/src/doctorCommand.js

      - name: Run MCP Server Package Tests
        run: node --test apps/mcp-server/test/*.test.mjs

      - name: Run Server & ADR Security Tests
        run: node --test apps/server/test/*.test.mjs

      - name: Run Mechanical Anti-Slop README Invariant Gate
        run: python scripts/audit_readme.py --strict

      - name: Verify Package Version Matches Release Tag & server.json
        run: |
          PKG_VERSION=$(node -p "require('./apps/mcp-server/package.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          SERVER_PKG_VERSION=$(node -p "require('./server.json').packages[0].version")
          echo "Package version: $PKG_VERSION | server.json: $SERVER_VERSION | server.json package: $SERVER_PKG_VERSION"
          if [[ "$PKG_VERSION" != "$SERVER_VERSION" || "$PKG_VERSION" != "$SERVER_PKG_VERSION" ]]; then
            echo "FATAL: apps/mcp-server/package.json ($PKG_VERSION) does not match server.json ($SERVER_VERSION / $SERVER_PKG_VERSION)!"
            exit 1
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Release tag: $TAG_VERSION"
            if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
              echo "FATAL: package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)!"
              exit 1
            fi
          fi

      - name: Publish to npm with Sigstore Provenance
        working-directory: apps/mcp-server
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if curl -sf "https://registry.npmjs.org/@cavdax%2fmcp-server/$PKG_VERSION" >/dev/null; then
            echo "@cavdax/mcp-server@$PKG_VERSION is already published on npm — skipping duplicate npm publish."
          else
            npm publish --access public --provenance
          fi

      - name: Wait for npm CDN propagation
        run: |
          PKG_VERSION=$(node -p "require('./apps/mcp-server/package.json').version")
          for i in $(seq 1 18); do
            if curl -sf "https://registry.npmjs.org/@cavdax%2fmcp-server/$PKG_VERSION" >/dev/null; then
              echo "npm registry propagated @cavdax/mcp-server@$PKG_VERSION (attempt $i)."
              exit 0
            fi
            echo "Waiting for npm propagation ($i/18)..."
            sleep 5
          done
          echo "Proceeding after propagation wait."

      - name: Publish to Official MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
